<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cluster Map Editor</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <button id="mobile-panel-toggle" class="mobile-panel-toggle" type="button" aria-expanded="false">패널 열기</button>
    <div id="mobile-panel-backdrop" class="mobile-panel-backdrop"></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <h1>Cluster Map Editor</h1>
        <p class="muted">클러스터를 보고, 위치 override rule을 저장하는 1차 관리자 화면입니다.</p>

        <section class="panel-section is-open" data-section="editor">
          <button class="panel-section-toggle" type="button" data-panel-toggle="editor" aria-expanded="true">
            <span id="editor-section-title">규칙 추가</span>
          </button>
          <div class="panel-section-body">
          <form id="rule-form">
            <label>이름<input name="name" required /></label>
            <label>국가<input name="country" value="대한민국" /></label>
            <label>시/도<input name="state" /></label>
            <label>도시/구/동<input name="city" /></label>
            <label>우선순위<input type="number" name="priority" value="100" /></label>
            <label class="checkbox"><input type="checkbox" name="applyAsOverride" checked /> 주소 override로 사용</label>
            <label class="checkbox"><input type="checkbox" name="treatAsSingleCluster" /> 폴리곤 내부를 단일 클러스터로 취급</label>
            <label class="checkbox"><input type="checkbox" name="enabled" checked /> 활성화</label>
          </form>
          <p id="editor-mode-hint" class="hint">polygon은 3개 이상 점을 찍고 완료하세요. 완료(✓)를 누르면 중심점 기준으로 시/도와 도시/구/동을 자동 채웁니다. 편집 중에는 작은 점 탭으로 꼭짓점 추가, 꼭짓점 더블탭으로 삭제할 수 있습니다.</p>
          </div>
        </section>

        <section class="panel-section is-open" data-section="rules">
          <div class="section-header">
            <button class="panel-section-toggle" type="button" data-panel-toggle="rules" aria-expanded="true">
              <span>규칙 목록</span>
            </button>
            <button id="refresh-rules" type="button">새로고침</button>
          </div>
          <div class="panel-section-body">
            <ul id="rule-list" class="rule-list"></ul>
          </div>
        </section>

        <section class="panel-section" data-section="preview">
          <button class="panel-section-toggle" type="button" data-panel-toggle="preview" aria-expanded="false">
            <span>미리보기 결과</span>
          </button>
          <div class="panel-section-body">
            <pre id="preview-output" class="preview-output">아직 실행하지 않았습니다.</pre>
          </div>
        </section>

        <div class="floating-action-bar">
          <button id="save-rule-button" type="button">저장</button>
          <button id="save-apply-rule-button" type="button" class="primary-action">저장 후 적용</button>
        </div>
      </aside>

      <main class="map-wrap">
        <div class="map-floating-tools">
          <div class="toolbar-primary">
            <button id="start-polygon" type="button" title="폴리곤 그리기" aria-label="폴리곤 그리기">⬠</button>
            <button id="finish-shape" type="button" title="도형 완료" aria-label="도형 완료">✓</button>
            <button id="clear-shape" type="button" title="초기화" aria-label="초기화">↺</button>
            <button id="save-edit" type="button" title="편집 저장" aria-label="편집 저장" disabled>💾</button>
            <button id="cancel-edit" type="button" title="편집 취소" aria-label="편집 취소" disabled>✕</button>
            <button id="refresh-clusters" type="button" title="클러스터 새로고침" aria-label="클러스터 새로고침">⟳</button>
          </div>
        </div>
        <div class="map-stage">
          <div id="map"></div>
          <aside id="photo-panel" class="photo-panel" aria-hidden="true">
            <div class="photo-panel-header">
              <div>
                <strong id="photo-panel-title">사진</strong>
                <div id="photo-panel-subtitle" class="muted"></div>
              </div>
              <button id="photo-panel-close" type="button" aria-label="사진 패널 닫기">✕</button>
            </div>
            <div id="photo-panel-list" class="photo-panel-list"></div>
            <div id="photo-panel-status" class="photo-panel-status muted">마커를 선택하면 사진이 표시됩니다.</div>
          </aside>
        </div>
      </main>
    </div>

    <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true">
      <div id="photo-lightbox-backdrop" class="photo-lightbox-backdrop"></div>
      <div class="photo-lightbox-dialog">
        <button id="photo-lightbox-close" type="button" aria-label="큰 사진 닫기">✕</button>
        <img id="photo-lightbox-image" class="photo-lightbox-image" alt="preview" />
        <div class="photo-lightbox-meta">
          <div id="photo-lightbox-title" class="photo-lightbox-title"></div>
          <div id="photo-lightbox-date" class="photo-lightbox-date"></div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
